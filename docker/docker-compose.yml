# 本地开发依赖：PostgreSQL + Redis
# 起停：bash scripts/deps_up.sh / bash scripts/deps_down.sh
#      或 docker compose -f docker/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: rbac-postgres
    environment:
      POSTGRES_DB: precision
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      # 与 application.yml 的 datasource 保持一致；生产环境务必换掉
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d precision"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: rbac-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
