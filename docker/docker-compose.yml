# 本地开发依赖：MySQL / PostgreSQL（二选一，用 profile 隔离）+ Redis（两种数据库都要）
# SQLite 不需要容器，是文件型库，见 backend/gentry-start/src/main/resources/application-sqlite.yml
#
# 起停：
#   bash scripts/deps_up.sh              # 默认起 MySQL + Redis
#   bash scripts/deps_up.sh --db=postgresql
#   bash scripts/deps_down.sh [--purge]
# 或直接用 docker compose：
#   docker compose -f docker/docker-compose.yml --profile mysql up -d
#   docker compose -f docker/docker-compose.yml --profile postgresql up -d
#
# 显式 project name：目录名叫 docker，若本机还跑着别的项目、其 compose 文件也放在
# 同名 docker/ 目录下，Compose 会按目录名撞出同一个 project，进而共享同名 volume
# （mysqldata/redisdata），互相顶掉对方的数据卷。显式 name 把这个项目的资源
# （容器/卷/网络）用 rbac_ 前缀隔离开，不会和别的项目撞。
name: rbac
services:
  mysql:
    image: mysql:8.0
    container_name: rbac-mysql
    profiles: ["mysql"]
    environment:
      MYSQL_DATABASE: gentry
      MYSQL_ROOT_PASSWORD: "123456"
      TZ: Asia/Shanghai
    command:
      # 与 application-mysql.yml 的 datasource 保持一致；生产环境务必换掉口令
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 5s
      timeout: 3s
      retries: 30

  postgres:
    image: postgres:16-alpine
    container_name: rbac-postgres
    profiles: ["postgresql"]
    environment:
      POSTGRES_DB: gentry
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      # 与 application-postgresql.yml 的 datasource 保持一致；生产环境务必换掉
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gentry"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: rbac-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysqldata:
  pgdata:
  redisdata:
