server:
  port: 9090

spring:
  messages:
    basename: i18n/messages
    encoding: UTF-8

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  datasource:
    url: jdbc:postgresql://localhost:5432/precision
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  # Redis（Sa-Token JWT 模式依赖 Redis 存储 Session 与 Token 黑名单）
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 3000
      lettuce:
        pool:
          max-active: 200
          max-idle: 10
          min-idle: 0

  # 禁用 Spring Security 默认登录页（我们用 Sa-Token）
  security:
    user:
      name: disabled
      password: disabled

mybatis-flex:
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    print-banner: false
  configuration:
    map-underscore-to-camel-case: true

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 1800               # AccessToken 有效期 30 分钟（JWT exp 字段）
  active-timeout: -1          # 关闭活跃超时（JWT 自带 exp，无需额外活跃检查）
  is-concurrent: true
  is-share: false
  token-style: jwt-simple     # Token 样式：jwt-simple（Sa-Token JWT 整合 Simple 模式，保留 Session 能力）
  is-log: false
  # JWT 签名密钥（256-bit 以上），生产环境通过环境变量 SA_TOKEN_JWT_SECRET_KEY 外置
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET_KEY:precision-iov-platform-jwt-secret-key-2026-change-me}

logging:
  level:
    com.precision: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:--}] [%thread] %logger{36} - %msg%n"

# Actuator：暴露 Prometheus 指标端点（无 Token 认证）
management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info
  endpoint:
    prometheus:
      enabled: true
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: precision-platform
