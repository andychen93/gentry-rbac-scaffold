# SQLite 3.35+ 连接配置
# 定位：本地体验 / 单元测试 / demo，不建议在多进程并发写场景下用于生产
# （SQLite 文件级锁，写并发能力弱于 MySQL/PostgreSQL）。
#
# 无需起容器，数据文件直接落在 backend/gentry-start/ 下的 gentry.db，
# 首次启动 Flyway 会自动建表。删掉这个文件就是清库重来。
spring:
  datasource:
    url: jdbc:sqlite:gentry.db
    driver-class-name: org.sqlite.JDBC
    # SQLite 单文件写锁：连接池开大了并发写会直接报 "database is locked"，
    # 限制为 1 让所有写操作排队，规避这个问题（读也走这一个连接，够本地/demo 场景用）
    hikari:
      maximum-pool-size: 1

  flyway:
    # 双流合并：平台流（rbac-starter jar 内，V1–V999 平台保留段）
    #          + 项目流（本模块 classpath，消费项目自 V1000 起）
    # 注意保持 classpath: 前缀 —— Flyway 的 ClassPathScanner 走 ClassLoader.getResources()
    # 枚举所有 classpath 根（含依赖 jar），天然跨 jar，不要写成 Spring 方言 classpath*:
    locations: classpath:db/migration/gentry-rbac/common,classpath:db/migration/gentry-rbac/sqlite,classpath:db/migration/common,classpath:db/migration/sqlite
