# MySQL / MariaDB 8.0+ 连接配置（默认 profile）
# 本地起库： bash scripts/deps_up.sh --db=mysql   （docker-compose 里的 mysql 服务，3306 端口）
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/gentry?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    # 仓库默认 123456 与 docker/docker-compose.yml 的 MYSQL_ROOT_PASSWORD 一致；
    # 连本地自建 MySQL 时用环境变量注入真实密码（同 dev_up.sh 的 DB_PASSWORD 约定），
    # 不要把真实密码写回本文件（测试用 -Dspring.datasource.password=<真实密码>）
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    # 双流合并：平台流（rbac-starter jar 内，V1–V999 平台保留段）
    #          + 项目流（本模块 classpath，消费项目自 V1000 起）
    # 注意保持 classpath: 前缀 —— Flyway 的 ClassPathScanner 走 ClassLoader.getResources()
    # 枚举所有 classpath 根（含依赖 jar），天然跨 jar，不要写成 Spring 方言 classpath*:
    locations: classpath:db/migration/gentry-rbac/common,classpath:db/migration/gentry-rbac/mysql,classpath:db/migration/common,classpath:db/migration/mysql
