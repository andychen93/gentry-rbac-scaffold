# MySQL / MariaDB 8.0+ 连接配置（默认 profile）
# 本地起库： bash scripts/deps_up.sh --db=mysql   （docker-compose 里的 mysql 服务，3306 端口）
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/gentry?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    locations: classpath:db/migration/common,classpath:db/migration/mysql
