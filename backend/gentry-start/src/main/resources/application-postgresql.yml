# PostgreSQL 14+ 连接配置
# 本地起库： bash scripts/deps_up.sh --db=postgresql   （docker-compose 里的 postgres 服务，5432 端口）
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/gentry
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  flyway:
    # 双流合并：平台流（rbac-starter jar 内，V1–V999 平台保留段）
    #          + 项目流（本模块 classpath，消费项目自 V1000 起）
    # 注意保持 classpath: 前缀 —— Flyway 的 ClassPathScanner 走 ClassLoader.getResources()
    # 枚举所有 classpath 根（含依赖 jar），天然跨 jar，不要写成 Spring 方言 classpath*:
    locations: classpath:db/migration/gentry-rbac/common,classpath:db/migration/gentry-rbac/postgresql,classpath:db/migration/common,classpath:db/migration/postgresql
